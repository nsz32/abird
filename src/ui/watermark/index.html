<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bird - Watermark</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #202830;
		}
		.watermark {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			font-family: system-ui, -apple-system, sans-serif;
			font-size: 13vh;
			font-weight: bold;
			color: #253038;
			text-shadow: 1vh 1vh 1.1vh #161c22;
			user-select: none;
			pointer-events: none;
			letter-spacing: 0.07em;
		}
	</style>
</head>
<body>
	<div class="watermark">bird °></div>
</body>
</html>
